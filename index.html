<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>krsh.ai | Private Root v1.6</title>
    <style>
        body { 
            background-color: #000; 
            color: #0f0; 
            font-family: 'Courier New', monospace; 
            padding: 15px; 
            margin: 0; 
            height: 100vh; 
            box-sizing: border-box; 
            overflow: hidden; 
        }
        #terminal { 
            width: 100%; 
            height: 100%; 
            overflow-y: auto; 
            font-size: 13px; 
            line-height: 1.4;
        }
        .line { display: block; margin-bottom: 5px; white-space: pre-wrap; }

        /* Input System (Fix Cursor Double) */
        .input-container { display: flex; align-items: center; position: relative; }
        .real-input { 
            position: absolute; left: 0; opacity: 0; width: 100%;
            border: none; outline: none; cursor: default;
            caret-color: transparent;
        }
        .display-text { color: #0f0; letter-spacing: 2px; }

        /* Single Block Cursor */
        .caret { 
            width: 8px; height: 16px; background: #0f0; 
            display: inline-block; vertical-align: middle;
            margin-left: 2px; animation: blink 1s infinite; 
        }

        /* Maintenance Box Compact */
        .maintenance-note {
            position: fixed; bottom: 20px; left: 20px;
            background-color: rgba(18, 18, 18, 0.96); color: #fff;
            padding: 12px 18px; border-radius: 8px; border-left: 3px solid #0f0;
            font-family: sans-serif; font-size: 11px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.8); z-index: 10000;
            display: flex; align-items: center; gap: 12px; max-width: 280px;
            animation: fadeIn 1s ease-out forwards;
        }
        .maintenance-note b { color: #0f0; display: block; font-size: 12px; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes blink { 50% { opacity: 0; } }
        .hidden { display: none !important; }
        .db-report { color: #0f0; margin: 15px 0; padding: 10px; border: 1px dashed #0f0; }
    </style>
</head>
<body>

    <div id="maintenance-msg" class="maintenance-note">
        <div style="font-size: 18px;">🛠️</div>
        <div><b>SISTEM MAINTENANCE</b>Sedang dalam perbaikan berkala oleh Admin Kanza.</div>
    </div>

    <div id="terminal">
        <span class="line">KRSH_AI PRIVATE KERNEL [Version 1.6.0_STABLE]</span>
        <span class="line">RESTRICTED ACCESS: ADMIN KANZA ONLY.</span>
        <span class="line">&nbsp;</span>
        <span class="line">Please authenticate to open secure tunnel:</span>
        
        <div id="login-area" class="input-container" onclick="document.getElementById('authKey').focus()">
            <span style="margin-right: 10px;">kanza@krsh_ai:~#</span>
            <span id="login-display" class="display-text"></span><span id="login-caret" class="caret"></span>
            <input type="password" id="authKey" class="real-input" autofocus oninput="updateLoginDisplay()" onkeydown="handleLogin(event)">
        </div>
        
        <div id="logs"></div>

        <div id="command-area" class="input-container hidden" onclick="document.getElementById('cmdInput').focus()">
            <span style="margin-right: 10px;">kanza@krsh_ai_private:~$</span>
            <span id="cmd-display" class="display-text" style="letter-spacing: 0;"></span><span class="caret"></span>
            <input type="text" id="cmdInput" class="real-input" oninput="updateCmdDisplay()" onkeydown="handleCommand(event)">
        </div>
    </div>

    <script>
        const authKey = document.getElementById('authKey');
        const loginDisplay = document.getElementById('login-display');
        const cmdInput = document.getElementById('cmdInput');
        const cmdDisplay = document.getElementById('cmd-display');
        const logs = document.getElementById('logs');

        function updateLoginDisplay() { loginDisplay.textContent = "*".repeat(authKey.value.length); }
        function updateCmdDisplay() { cmdDisplay.textContent = cmdInput.value; }

        async function handleLogin(e) {
            if (e.key === 'Enter') {
                const secret = "Kz!@#99_X-Rsh.Ai";
                if (authKey.value === secret) {
                    document.getElementById('login-area').classList.add('hidden');
                    await print("> [OK] Identity verified: Admin Kanza.");
                    await successSequence();
                } else {
                    location.reload();
                }
            }
        }

        async function handleCommand(e) {
            if (e.key === 'Enter') {
                const cmd = cmdInput.value.trim().toLowerCase(); // Pakai trim biar spasi di depan/belakang aman
                const currentInput = cmdInput.value;
                cmdInput.value = ""; 
                updateCmdDisplay();

                // Echo perintah yang baru diketik biar kayak terminal asli
                await print(`kanza@krsh_ai_private:~$ ${currentInput}`);

                if (cmd === "refresh" || cmd === "refresh pages" || cmd === "reboot" || cmd === "system --reload") {
                    await print("> Initiating system reboot...");
                    await new Promise(r => setTimeout(r, 1000));
                    location.reload();
                } else if (cmd !== "") {
                    await print(`> Command '${currentInput}' not found.`);
                }
            }
        }

        async function print(text) {
            const l = document.createElement('span');
            l.className = 'line';
            l.textContent = text;
            logs.appendChild(l);
            logs.scrollTop = logs.scrollHeight;
        }

        async function successSequence() {
            const msg = [
                "------------------------------------------",
                "SYSTEM ONLINE - WELCOME BOSS.",
                "------------------------------------------",
                "> Database Sync   : [READY]",
                "------------------------------------------"
            ];
            for (let t of msg) {
                const l = document.createElement('span');
                l.className = 'line';
                logs.appendChild(l);
                for (let c of t) { l.textContent += c; await new Promise(r => setTimeout(r, 20)); }
            }
            
            const db = document.createElement('div');
            db.className = 'db-report';
            db.innerHTML = `📊 <b>SERVER LOG: MIGRATION SUCCESS</b><br>Data secured on private-kanza-server.db`;
            logs.appendChild(db);

            document.getElementById('command-area').classList.remove('hidden');
            cmdInput.focus();
        }
    </script>
</body>
</html>
