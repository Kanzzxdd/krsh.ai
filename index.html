<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>krsh.ai | Private Root v1.6</title>
    <style>
        body { 
            background-color: #000; 
            color: #0f0; 
            font-family: 'Courier New', monospace; 
            padding: 15px; 
            margin: 0; 
            height: 100vh; 
            box-sizing: border-box; 
            overflow: hidden; 
        }
        #terminal { width: 100%; height: 100%; overflow-y: auto; }
        .line { display: block; margin-bottom: 5px; white-space: pre-wrap; }

        /* Container Input */
        #input-area { 
            display: flex; 
            align-items: center; 
            position: relative; 
        }

        /* Input asli dibuat transparan & sembunyi di balik teks */
        input { 
            position: absolute;
            left: 0;
            opacity: 0; /* Benar-benar tidak terlihat */
            width: 100%;
            cursor: default;
            border: none;
            outline: none;
        }

        /* Tampilan teks password (bintang/titik) yang kita buat sendiri */
        #display-text { color: #0f0; letter-spacing: 2px; }

        /* Kursor Blok Hijau sesuai screenshot */
        #caret { 
            width: 10px; 
            height: 18px; 
            background: #0f0; 
            display: inline-block; 
            vertical-align: middle;
            animation: blink 1s infinite;
            margin-left: 2px;
        }

        @keyframes blink { 50% { opacity: 0; } }
        .err { color: #ff0000; }
    </style>
</head>
<body>
    <div id="terminal">
        <span class="line">KRSH_AI PRIVATE KERNEL [Version 1.6.0_STABLE]</span>
        <span class="line">RESTRICTED ACCESS: ADMIN KANZA ONLY.</span>
        <span class="line">&nbsp;</span>
        <span class="line">Please authenticate to open secure tunnel:</span>
        
        <div id="input-area" onclick="focusInput()">
            <span style="margin-right: 10px;">kanza@krsh_ai:~#</span>
            <span id="display-text"></span><span id="caret"></span>
            <input type="password" id="authKey" autofocus oninput="updateDisplay()" onkeydown="check(event)">
        </div>
        
        <div id="logs"></div>
    </div>

    <script>
        const authKey = document.getElementById('authKey');
        const displayText = document.getElementById('display-text');
        const logs = document.getElementById('logs');
        const inputArea = document.getElementById('input-area');

        // Fokus ke input kalau area diklik
        function focusInput() { authKey.focus(); }

        // Update tampilan karakter password
        function updateDisplay() {
            displayText.textContent = "*".repeat(authKey.value.length);
        }

        function check(e) { if (e.key === 'Enter') { validate(); } }

        async function validate() {
            const secret = "Kz!@#99_X-Rsh.Ai";
            if (authKey.value === secret) {
                inputArea.classList.add('hidden');
                await print("> [OK] Identity verified: Admin Kanza.");
                await successSequence();
            } else {
                inputArea.style.display = 'none';
                await print("> [ERROR] ACCESS DENIED.", "err");
                await new Promise(r => setTimeout(r, 2000));
                location.reload();
            }
        }

        async function print(text, className = "") {
            const l = document.createElement('span');
            l.className = 'line ' + className;
            l.textContent = text;
            logs.appendChild(l);
        }

        async function successSequence() {
            const msg = [
                "------------------------------------------",
                "SYSTEM ONLINE - WELCOME BOSS.",
                "------------------------------------------",
                "> Data Migrated to Private Database Server",
                "Ready for commands..."
            ];
            for (let t of msg) {
                const l = document.createElement('span');
                l.className = 'line';
                logs.appendChild(l);
                for (let c of t) {
                    l.textContent += c;
                    await new Promise(r => setTimeout(r, 25));
                }
            }
        }
    </script>
</body>
</html>
