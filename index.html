<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>krsh.ai | Private Root v1.6</title>
    <style>
        body { background-color: #000; color: #0f0; font-family: 'Courier New', monospace; padding: 15px; margin: 0; height: 100vh; box-sizing: border-box; overflow: hidden; }
        #terminal { width: 100%; height: 100%; overflow-y: auto; font-size: 13px; line-height: 1.4; }
        .line { display: block; margin-bottom: 5px; white-space: pre-wrap; }
        .input-container { display: flex; align-items: center; position: relative; }
        .real-input { position: absolute; left: 0; opacity: 0; width: 100%; border: none; outline: none; cursor: default; caret-color: transparent; }
        .display-text { color: #0f0; letter-spacing: 1px; }
        .caret { width: 8px; height: 16px; background: #0f0; display: inline-block; vertical-align: middle; margin-left: 2px; animation: blink 1s infinite; }
        
        /* Popup Chat Box Modern */
        #ai-popup {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 320px; height: 450px; background: #111; border: 1px solid #0f0;
            border-radius: 12px; display: none; flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9); z-index: 20000; overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
        }
        #chat-header { background: #1a1a1a; padding: 15px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        #chat-content { flex: 1; padding: 15px; overflow-y: auto; color: #ccc; font-size: 13px; display: flex; flex-direction: column; gap: 10px; }
        #chat-input-area { padding: 10px; background: #1a1a1a; display: flex; gap: 8px; }
        #chat-msg { flex: 1; background: #222; border: 1px solid #333; border-radius: 5px; color: #fff; padding: 8px; outline: none; font-size: 12px; }
        .msg-ai { align-self: flex-start; background: #333; padding: 8px 12px; border-radius: 12px 12px 12px 0; max-width: 85%; line-height: 1.4; }
        .msg-user { align-self: flex-end; background: #0f0; color: #000; padding: 8px 12px; border-radius: 12px 12px 0 12px; max-width: 85%; font-weight: bold; }

        .maintenance-note { position: fixed; bottom: 20px; left: 20px; background: rgba(18,18,18,0.9); color: #fff; padding: 10px; border-radius: 8px; border-left: 3px solid #0f0; font-family: sans-serif; font-size: 10px; z-index: 10000; display: flex; align-items: center; gap: 10px; animation: fadeIn 1s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes blink { 50% { opacity: 0; } }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="maintenance-msg" class="maintenance-note">
        <div style="font-size: 16px;">🛠️</div>
        <div><b>SISTEM MAINTENANCE</b>Sedang dalam perbaikan berkala oleh Admin Kanza.</div>
    </div>

    <div id="ai-popup">
        <div id="chat-header">
            <span id="ai-title" style="color: #0f0; font-weight: bold; font-size: 13px;">AI ASSISTANT</span>
            <button onclick="closeChat()" style="background: none; border: none; color: #ff4444; cursor: pointer; font-size: 18px;">&times;</button>
        </div>
        <div id="chat-content">
            <div class="msg-ai">Koneksi aman. Silahkan kirim pesan, Boss Kanza.</div>
        </div>
        <div id="chat-input-area">
            <input type="text" id="chat-msg" placeholder="Tulis pesan..." onkeydown="if(event.key==='Enter') sendChat()">
            <button onclick="sendChat()" style="background: #0f0; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer;">🚀</button>
        </div>
    </div>

    <div id="terminal">
        <span class="line">KRSH_AI PRIVATE KERNEL [Version 1.6.0_STABLE]</span>
        <span class="line">RESTRICTED ACCESS: ADMIN KANZA ONLY.</span>
        <span class="line">&nbsp;</span>
        <div id="login-area" class="input-container" onclick="document.getElementById('authKey').focus()">
            <span style="margin-right: 10px;">kanza@krsh_ai:~#</span>
            <span id="login-display" class="display-text"></span><span id="login-caret" class="caret"></span>
            <input type="password" id="authKey" class="real-input" autofocus oninput="updateLoginDisplay()" onkeydown="handleLogin(event)">
        </div>
        <div id="logs"></div>
        <div id="command-area" class="input-container hidden" onclick="document.getElementById('cmdInput').focus()">
            <span style="margin-right: 10px;">kanza@krsh_ai_private:~$</span>
            <span id="cmd-display" class="display-text" style="letter-spacing: 0;"></span><span class="caret"></span>
            <input type="text" id="cmdInput" class="real-input" oninput="updateCmdDisplay()" onkeydown="handleCommand(event)">
        </div>
    </div>

    <script>
        const authKey = document.getElementById('authKey');
        const loginDisplay = document.getElementById('login-display');
        const cmdInput = document.getElementById('cmdInput');
        const cmdDisplay = document.getElementById('cmd-display');
        const logs = document.getElementById('logs');
        const aiPopup = document.getElementById('ai-popup');
        
        let chatState = 0; 
        let userApiKey = "";

        function updateLoginDisplay() { loginDisplay.textContent = "*".repeat(authKey.value.length); }
        function updateCmdDisplay() { cmdDisplay.textContent = cmdInput.value; }

        async function handleLogin(e) {
            if (e.key === 'Enter') {
                if (authKey.value === "Kz!@#99_X-Rsh.Ai") {
                    document.getElementById('login-area').classList.add('hidden');
                    await print("> [OK] Identity verified: Admin Kanza.");
                    await successSequence();
                } else { location.reload(); }
            }
        }

        async function handleCommand(e) {
            if (e.key === 'Enter') {
                const fullCmd = cmdInput.value;
                const cmdClean = fullCmd.trim().toLowerCase();
                cmdInput.value = ""; updateCmdDisplay();
                await print(`kanza@krsh_ai_private:~$ ${fullCmd}`);

                if (chatState === 0) {
                    if (cmdClean === "ai --chat") {
                        chatState = 1;
                        await print("\n🔑 Masukkan API Key Google Gemini Anda:");
                    } else if (["refresh", "refresh pages", "reboot"].includes(cmdClean)) {
                        location.reload();
                    } else if (cmdClean !== "") { await print(`> Command '${fullCmd}' not found.`); }
                } 
                else if (chatState === 1) {
                    userApiKey = fullCmd;
                    chatState = 2;
                    await print("> API Key tersimpan secara lokal.");
                    await print("🤖 Nama AI (atau ketik -skip):");
                }
                else if (chatState === 2) {
                    const aiName = (cmdClean === "-skip") ? "ZANDER AI" : fullCmd.toUpperCase();
                    document.getElementById('ai-title').textContent = aiName;
                    chatState = 0;
                    await print("> Menghubungkan ke Neural Link...");
                    await new Promise(r => setTimeout(r, 1000));
                    aiPopup.style.display = 'flex';
                }
            }
        }

        async function sendChat() {
            const input = document.getElementById('chat-msg');
            const content = document.getElementById('chat-content');
            const userMsg = input.value.trim();
            if (userMsg === "" || !userApiKey) return;

            content.innerHTML += `<div class="msg-user">${userMsg}</div>`;
            input.value = "";
            content.scrollTop = content.scrollHeight;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${userApiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: userMsg }] }] })
                });
                const data = await response.json();
                const aiResponse = data.candidates[0].content.parts[0].text;
                content.innerHTML += `<div class="msg-ai">${aiResponse}</div>`;
            } catch (err) {
                content.innerHTML += `<div class="msg-ai" style="color:red">Error: Pastikan API Key valid.</div>`;
            }
            content.scrollTop = content.scrollHeight;
        }

        function closeChat() { aiPopup.style.display = 'none'; }
        async function print(text) { const l = document.createElement('span'); l.className = 'line'; l.textContent = text; logs.appendChild(l); logs.scrollTop = logs.scrollHeight; }
        async function successSequence() {
            await print("------------------------------------------");
            await print("SYSTEM ONLINE - WELCOME BOSS.");
            await print("Type 'ai --chat' to start Neural Session.");
            document.getElementById('command-area').classList.remove('hidden');
            cmdInput.focus();
        }
    </script>
</body>
</html>
