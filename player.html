<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>in-another-life-Kanzz.rox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080808;
    --surface: rgba(255,255,255,0.04);
    --surface-2: rgba(255,255,255,0.07);
    --glass: rgba(20,20,24,0.82);
    --glass-border: rgba(255,255,255,0.08);
    --accent: #5B8DFF;
    --accent-glow: rgba(91,141,255,0.35);
    --text: #F0F0F2;
    --text-muted: rgba(240,240,242,0.45);
    --radius-xl: 28px;
    --radius-lg: 18px;
    --radius-md: 12px;
    --sheet-h: 72vh;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ── GRAIN OVERLAY ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 9999;
  }

  /* ── LAYOUT ── */
  .page {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    gap: 0;
    position: relative;
  }

  /* ── AMBIENT GLOW ── */
  .ambient {
    position: fixed; inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .ambient-blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0.12;
    animation: drift 12s ease-in-out infinite alternate;
  }
  .ambient-blob:nth-child(1) {
    width: 500px; height: 500px;
    background: #3B6FF5;
    top: -100px; left: -150px;
    animation-delay: 0s;
  }
  .ambient-blob:nth-child(2) {
    width: 400px; height: 400px;
    background: #8B45FF;
    bottom: -80px; right: -100px;
    animation-delay: -4s;
  }
  .ambient-blob:nth-child(3) {
    width: 300px; height: 300px;
    background: #00C2FF;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    animation-delay: -8s;
    opacity: 0.06;
  }
  @keyframes drift {
    from { transform: translateY(0) scale(1); }
    to   { transform: translateY(40px) scale(1.08); }
  }

  /* ── HEADER ── */
  .header {
    position: fixed; top: 0; left: 0; right: 0;
    padding: max(14px, env(safe-area-inset-top, 14px)) 20px 14px;
    display: flex; align-items: center; justify-content: space-between;
    z-index: 100;
  }
  .header-left {
    display: flex; align-items: center; gap: 10px;
  }
  .logo-dot {
    width: 8px; height: 8px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--accent-glow);
    animation: pulse-dot 2s ease-in-out infinite;
  }
  @keyframes pulse-dot {
    0%,100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(0.8); }
  }
  .logo-text {
    font-size: 13px; font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--text-muted);
  }
  .header-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--surface-2);
    border: 1px solid var(--glass-border);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    color: var(--text-muted);
  }
  .header-btn:active { transform: scale(0.9); }
  .header-btn:hover { background: rgba(255,255,255,0.1); }

  /* ── PLAYER WRAPPER ── */
  .player-wrap {
    position: relative;
    width: min(90vw, 90vh - 200px);
    max-width: 560px;
    aspect-ratio: 1/1;
    border-radius: var(--radius-xl);
    overflow: hidden;
    box-shadow:
      0 2px 0 rgba(255,255,255,0.06) inset,
      0 32px 80px rgba(0,0,0,0.7),
      0 0 0 1px var(--glass-border),
      0 0 60px rgba(91,141,255,0.12);
    cursor: pointer;
    transition: transform 0.4s cubic-bezier(.34,1.56,.64,1);
  }
  .player-wrap:active { transform: scale(0.985); }

  video {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    background: #0a0a0e;
  }

  /* ── PLAY/PAUSE OVERLAY ── */
  .tap-overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .tap-icon {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.15);
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    transform: scale(0.6);
    transition: opacity 0.25s, transform 0.25s cubic-bezier(.34,1.56,.64,1);
    pointer-events: none;
  }
  .tap-icon.show {
    opacity: 1; transform: scale(1);
  }
  .tap-icon svg { width: 28px; height: 28px; fill: #fff; }

  /* ── CONTROL BAR ── */
  .controls {
    width: min(90vw, 90vh - 200px);
    max-width: 560px;
    margin-top: 16px;
    background: var(--glass);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-xl);
    padding: 14px 16px 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  /* progress */
  .progress-row {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 12px;
  }
  .time-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: var(--text-muted);
    min-width: 34px;
    white-space: nowrap;
  }
  .progress-track {
    flex: 1; height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 99px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .progress-track::before {
    content: '';
    position: absolute; inset: 0;
    border-radius: inherit;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #8B6FFF);
    border-radius: 99px;
    width: 0%;
    transition: width 0.1s linear;
    position: relative;
  }
  .progress-fill::after {
    content: '';
    position: absolute; right: -6px; top: 50%;
    transform: translateY(-50%);
    width: 12px; height: 12px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 8px var(--accent-glow);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .progress-track:hover .progress-fill::after { opacity: 1; }

  /* buttons row */
  .btns-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 6px;
  }
  .ctrl-btn {
    width: 38px; height: 38px;
    border-radius: var(--radius-md);
    background: var(--surface-2);
    border: 1px solid var(--glass-border);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: var(--text);
    transition: background 0.18s, transform 0.15s, box-shadow 0.18s;
    flex-shrink: 0;
    position: relative;
  }
  .ctrl-btn:hover { background: rgba(255,255,255,0.1); }
  .ctrl-btn:active { transform: scale(0.88); }
  .ctrl-btn.accent {
    background: var(--accent);
    border-color: transparent;
    box-shadow: 0 4px 16px var(--accent-glow);
    width: 44px; height: 44px;
    border-radius: var(--radius-lg);
  }
  .ctrl-btn.accent:hover { background: #7BA3FF; }
  .ctrl-btn svg { width: 18px; height: 18px; fill: currentColor; }
  .ctrl-btn.accent svg { width: 20px; height: 20px; }

  /* volume row */
  .volume-row {
    display: flex; align-items: center; gap: 8px;
    flex: 1;
  }
  .vol-track {
    flex: 1; height: 3px;
    background: rgba(255,255,255,0.1);
    border-radius: 99px;
    cursor: pointer;
    max-width: 80px;
  }
  .vol-fill {
    height: 100%;
    background: rgba(255,255,255,0.4);
    border-radius: 99px;
    width: 80%;
    transition: width 0.1s;
  }

  /* speed chip */
  .speed-chip {
    background: var(--surface-2);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-md);
    padding: 6px 10px;
    font-size: 11px; font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    height: 38px;
    display: flex; align-items: center;
    transition: background 0.18s, color 0.18s;
    letter-spacing: 0.04em;
  }
  .speed-chip:hover { background: rgba(255,255,255,0.1); color: var(--text); }

  /* ── BOTTOM SHEET ── */
  .sheet-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0);
    z-index: 200;
    pointer-events: none;
    transition: background 0.35s;
  }
  .sheet-overlay.open {
    pointer-events: all;
    background: rgba(0,0,0,0.55);
  }
  .sheet {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: var(--sheet-h);
    background: rgba(14,14,18,0.92);
    backdrop-filter: blur(32px) saturate(160%);
    -webkit-backdrop-filter: blur(32px) saturate(160%);
    border-top-left-radius: var(--radius-xl);
    border-top-right-radius: var(--radius-xl);
    border-top: 1px solid var(--glass-border);
    transform: translateY(100%);
    transition: transform 0.42s cubic-bezier(.32,.72,0,1);
    z-index: 201;
    overflow: hidden;
    display: flex; flex-direction: column;
    padding-bottom: var(--safe-bottom);
    will-change: transform;
  }
  .sheet.open {
    transform: translateY(0);
  }

  .sheet-handle-wrap {
    padding: 14px 0 6px;
    display: flex; justify-content: center;
    cursor: grab;
    flex-shrink: 0;
  }
  .sheet-handle-wrap:active { cursor: grabbing; }
  .sheet-handle {
    width: 40px; height: 4px;
    background: rgba(255,255,255,0.18);
    border-radius: 99px;
  }

  .sheet-title {
    font-size: 17px; font-weight: 700;
    padding: 4px 24px 16px;
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  .sheet-title-text { letter-spacing: -0.01em; }
  .sheet-close {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: var(--text-muted);
    transition: background 0.18s;
  }
  .sheet-close:hover { background: rgba(255,255,255,0.14); }
  .sheet-close svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2.2; fill: none; }

  .sheet-body {
    flex: 1;
    overflow-y: auto;
    padding: 0 20px 24px;
    overscroll-behavior: contain;
  }
  .sheet-body::-webkit-scrollbar { display: none; }

  /* ── DOWNLOAD BTN ── */
  .dl-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--accent) 0%, #8B6FFF 100%);
    border: none;
    border-radius: var(--radius-xl);
    padding: 17px 24px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    font-family: 'Outfit', sans-serif;
    font-size: 15px; font-weight: 700;
    color: #fff;
    cursor: pointer;
    letter-spacing: 0.02em;
    box-shadow: 0 8px 28px rgba(91,141,255,0.35);
    transition: transform 0.18s, box-shadow 0.18s;
    position: relative;
    overflow: hidden;
  }
  .dl-btn::before {
    content: '';
    position: absolute; top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
    transition: left 0.5s;
  }
  .dl-btn:hover::before { left: 100%; }
  .dl-btn:active { transform: scale(0.97); box-shadow: 0 4px 14px rgba(91,141,255,0.25); }
  .dl-btn svg { width: 20px; height: 20px; fill: currentColor; }

  /* ── SECTION LABEL ── */
  .section-label {
    font-size: 11px; font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin: 20px 0 10px;
  }

  /* ── RESOLUTION PILLS ── */
  .res-row {
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .res-pill {
    flex: 1; min-width: 80px;
    background: var(--surface-2);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-lg);
    padding: 12px 8px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    cursor: pointer;
    transition: background 0.18s, border-color 0.18s, transform 0.15s;
  }
  .res-pill:active { transform: scale(0.95); }
  .res-pill.selected {
    background: rgba(91,141,255,0.14);
    border-color: rgba(91,141,255,0.5);
  }
  .res-name {
    font-size: 14px; font-weight: 700;
    color: var(--text);
  }
  .res-size {
    font-size: 10px; color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
  }
  .res-pill.selected .res-name { color: var(--accent); }
  .res-badge {
    font-size: 9px; font-weight: 700;
    background: var(--accent);
    color: #fff;
    padding: 2px 6px;
    border-radius: 99px;
    letter-spacing: 0.06em;
  }

  /* ── ACTION GRID ── */
  .action-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 4px;
  }
  .action-item {
    background: var(--surface-2);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-lg);
    padding: 14px 8px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    cursor: pointer;
    transition: background 0.18s, transform 0.15s;
  }
  .action-item:active { transform: scale(0.93); }
  .action-item:hover { background: rgba(255,255,255,0.07); }
  .action-icon {
    width: 38px; height: 38px;
    border-radius: var(--radius-md);
    display: flex; align-items: center; justify-content: center;
  }
  .action-icon svg { width: 18px; height: 18px; }
  .action-label {
    font-size: 11px; font-weight: 500;
    color: var(--text-muted);
    text-align: center;
    line-height: 1.3;
  }

  /* ── SHEET OPEN TRIGGER ── */
  .sheet-trigger {
    position: fixed;
    bottom: calc(28px + var(--safe-bottom));
    left: 50%;
    transform: translateX(-50%);
    display: flex; align-items: center; gap: 8px;
    background: var(--glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 99px;
    padding: 10px 18px;
    cursor: pointer;
    color: var(--text-muted);
    font-size: 12px; font-weight: 500;
    transition: transform 0.2s, opacity 0.2s, background 0.18s;
    z-index: 100;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .sheet-trigger:hover { background: rgba(30,30,36,0.9); color: var(--text); }
  .sheet-trigger:active { transform: translateX(-50%) scale(0.95); }
  .sheet-trigger svg { width: 14px; height: 14px; fill: var(--accent); }
  .sheet-trigger.hidden { opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(16px); }

  /* ── RIPPLE ── */
  @keyframes ripple {
    from { transform: scale(0); opacity: 0.4; }
    to   { transform: scale(4); opacity: 0; }
  }
  .ripple {
    position: absolute; border-radius: 50%;
    background: rgba(255,255,255,0.25);
    animation: ripple 0.55s ease-out forwards;
    pointer-events: none;
  }

  /* ── INFO ROW ── */
  .info-row {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-lg);
    padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 14px;
  }
  .info-row-label { font-size: 12px; color: var(--text-muted); }
  .info-row-val {
    font-size: 13px; font-weight: 600;
    font-family: 'JetBrains Mono', monospace;
    color: var(--text);
  }
  .info-row-val span { color: var(--accent); }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    top: 70px; left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: 99px;
    padding: 9px 18px;
    font-size: 12px; font-weight: 500;
    color: var(--text);
    opacity: 0;
    transition: opacity 0.25s, transform 0.25s;
    z-index: 9000;
    white-space: nowrap;
    pointer-events: none;
  }
  .toast.show {
    opacity: 1; transform: translateX(-50%) translateY(0);
  }

  /* ── FILE META CARD ── */
  .file-meta-card {
    display: flex; align-items: center; gap: 12px;
    background: rgba(91,141,255,0.07);
    border: 1px solid rgba(91,141,255,0.18);
    border-radius: var(--radius-lg);
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .file-meta-icon {
    width: 42px; height: 42px;
    border-radius: var(--radius-md);
    background: rgba(91,141,255,0.12);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .file-meta-info { min-width: 0; }
  .file-meta-name {
    font-size: 12px; font-weight: 600;
    color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    letter-spacing: -0.01em;
  }
  .file-meta-date {
    font-size: 10px; color: var(--text-muted);
    margin-top: 3px;
    font-family: 'JetBrains Mono', monospace;
  }
  .file-specs-row {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-bottom: 4px;
  }
  .spec-chip {
    background: var(--surface-2);
    border: 1px solid var(--glass-border);
    border-radius: 99px;
    padding: 4px 10px;
  }
  .spec-chip-accent {
    background: rgba(91,141,255,0.14);
    border-color: rgba(91,141,255,0.35);
  }
  .spec-val {
    font-size: 10px; font-weight: 600;
    font-family: 'JetBrains Mono', monospace;
    color: var(--text-muted);
    letter-spacing: 0.04em;
  }
  .spec-chip-accent .spec-val { color: var(--accent); }


  @media (max-width: 480px) {
    .player-wrap {
      width: 95vw;
      max-width: 95vw;
    }
    .controls {
      width: 95vw;
      max-width: 95vw;
    }
    :root { --sheet-h: 80vh; }
  }
  @media (min-height: 800px) {
    .player-wrap { width: min(85vw, 70vh); }
    .controls { width: min(85vw, 70vh); }
  }
</style>
</head>
<body>

<!-- Ambient blobs -->
<div class="ambient">
  <div class="ambient-blob"></div>
  <div class="ambient-blob"></div>
  <div class="ambient-blob"></div>
</div>

<!-- Header -->
<header class="header">
  <div class="header-left">
    <div class="logo-dot"></div>
    <span class="logo-text">OBSIDIAN</span>
  </div>
  <div class="header-btn" id="settingsBtn" title="Settings">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 8a4 4 0 100 8 4 4 0 000-8zm-9.5 4a9.5 9.5 0 1119 0 9.5 9.5 0 01-19 0zm9.5-1.5a1.5 1.5 0 100 3 1.5 1.5 0 000-3z"/>
    </svg>
  </div>
</header>

<!-- Main page -->
<div class="page" id="page">

  <!-- Player -->
  <div class="player-wrap" id="playerWrap">
    <video id="vid" loop playsinline muted
      src="in-another-life-Kanzz_rox.mp4">
    </video>
    <div class="tap-overlay">
      <div class="tap-icon" id="tapIcon">
        <svg viewBox="0 0 24 24" id="tapSvg"><path d="M8 5v14l11-7z"/></svg>
      </div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls" id="controls">
    <!-- Progress -->
    <div class="progress-row">
      <span class="time-label" id="timeCur">0:00</span>
      <div class="progress-track" id="progressTrack">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <span class="time-label" id="timeTot">0:00</span>
    </div>
    <!-- Buttons -->
    <div class="btns-row">
      <!-- Volume -->
      <div class="ctrl-btn" id="volBtn" title="Mute/Unmute">
        <svg viewBox="0 0 24 24" id="volIcon"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
      </div>
      <div class="volume-row">
        <div class="vol-track" id="volTrack"><div class="vol-fill" id="volFill"></div></div>
      </div>
      <!-- Play/Pause -->
      <div class="ctrl-btn accent" id="playBtn" title="Play/Pause">
        <svg viewBox="0 0 24 24" id="playIcon"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </div>
      <!-- Speed -->
      <div class="speed-chip" id="speedChip">1×</div>
      <!-- Fullscreen -->
      <div class="ctrl-btn" id="fsBtn" title="Fullscreen">
        <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
      </div>
      <!-- Download shortcut -->
      <div class="ctrl-btn" id="dlShortBtn" title="Download">
        <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
      </div>
    </div>
  </div>
</div>

<!-- Sheet trigger -->
<div class="sheet-trigger" id="sheetTrigger">
  <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
  <span>Download &amp; More</span>
  <svg viewBox="0 0 24 24" style="width:12px;height:12px;fill:var(--text-muted)"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
</div>

<!-- Bottom Sheet -->
<div class="sheet-overlay" id="sheetOverlay">
  <div class="sheet" id="sheet">
    <!-- Handle -->
    <div class="sheet-handle-wrap" id="sheetHandle">
      <div class="sheet-handle"></div>
    </div>
    <!-- File meta card -->
    <div class="file-meta-card">
      <div class="file-meta-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><rect x="2" y="2" width="20" height="20" rx="4"/><path d="M10 8l6 4-6 4V8z"/></svg>
      </div>
      <div class="file-meta-info">
        <div class="file-meta-name">in-another-life-Kanzz.rox.mp4</div>
        <div class="file-meta-date">Sunday, 24 May 2026 · 08:23</div>
      </div>
    </div>
    <div class="file-specs-row">
      <div class="spec-chip"><span class="spec-val">12.95 MB</span></div>
      <div class="spec-chip"><span class="spec-val">1080×1080</span></div>
      <div class="spec-chip"><span class="spec-val">0:23</span></div>
      <div class="spec-chip"><span class="spec-val">HEVC</span></div>
      <div class="spec-chip"><span class="spec-val">AAC</span></div>
      <div class="spec-chip spec-chip-accent"><span class="spec-val">60fps</span></div>
    </div>
    <!-- Title -->
    <div class="sheet-title" style="margin-top:8px">
      <span class="sheet-title-text">Download &amp; Share</span>
      <div class="sheet-close" id="sheetClose">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </div>
    </div>
    <!-- Scrollable body -->
    <div class="sheet-body">
      <!-- Download CTA -->
      <button class="dl-btn" id="dlMainBtn">
        <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        Download Video
      </button>

      <!-- Resolution -->
      <div class="section-label">Pilih Resolusi</div>
      <div class="res-row">
        <div class="res-pill" data-res="360">
          <span class="res-name">360p</span>
          <span class="res-size">~3.2 MB</span>
        </div>
        <div class="res-pill" data-res="720">
          <span class="res-name">720p</span>
          <span class="res-size">~7.8 MB</span>
          <span class="res-badge">HD</span>
        </div>
        <div class="res-pill selected" data-res="1080">
          <span class="res-name">1080p</span>
          <span class="res-size">12.95 MB</span>
          <span class="res-badge">FHD</span>
        </div>
      </div>

      <!-- File info -->
      <div class="info-row">
        <span class="info-row-label">Ukuran file dipilih</span>
        <span class="info-row-val"><span id="selectedSize">12.95</span> MB · 1080p FHD</span>
      </div>

      <!-- Actions -->
      <div class="section-label">Lainnya</div>
      <div class="action-grid">
        <div class="action-item" id="shareBtn">
          <div class="action-icon" style="background:rgba(0,194,255,0.12)">
            <svg viewBox="0 0 24 24" fill="none" stroke="#00C2FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
            </svg>
          </div>
          <span class="action-label">Share</span>
        </div>
        <div class="action-item" id="bookmarkBtn">
          <div class="action-icon" style="background:rgba(255,196,0,0.12)">
            <svg viewBox="0 0 24 24" fill="none" stroke="#FFC400" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/>
            </svg>
          </div>
          <span class="action-label">Simpan</span>
        </div>
        <div class="action-item" id="copyLinkBtn">
          <div class="action-icon" style="background:rgba(91,141,255,0.12)">
            <svg viewBox="0 0 24 24" fill="none" stroke="#5B8DFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/>
              <path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/>
            </svg>
          </div>
          <span class="action-label">Copy Link</span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  // ── ELEMENTS ──
  const vid = document.getElementById('vid');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const playerWrap = document.getElementById('playerWrap');
  const tapIcon = document.getElementById('tapIcon');
  const tapSvg = document.getElementById('tapSvg');
  const progressFill = document.getElementById('progressFill');
  const progressTrack = document.getElementById('progressTrack');
  const timeCur = document.getElementById('timeCur');
  const timeTot = document.getElementById('timeTot');
  const volBtn = document.getElementById('volBtn');
  const volIcon = document.getElementById('volIcon');
  const volTrack = document.getElementById('volTrack');
  const volFill = document.getElementById('volFill');
  const fsBtn = document.getElementById('fsBtn');
  const speedChip = document.getElementById('speedChip');
  const sheetTrigger = document.getElementById('sheetTrigger');
  const sheetOverlay = document.getElementById('sheetOverlay');
  const sheet = document.getElementById('sheet');
  const sheetClose = document.getElementById('sheetClose');
  const sheetHandle = document.getElementById('sheetHandle');
  const dlMainBtn = document.getElementById('dlMainBtn');
  const dlShortBtn = document.getElementById('dlShortBtn');
  const toast = document.getElementById('toast');
  const resPills = document.querySelectorAll('.res-pill');
  const selectedSize = document.getElementById('selectedSize');
  const shareBtn = document.getElementById('shareBtn');
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  const copyLinkBtn = document.getElementById('copyLinkBtn');

  // ── STATE ──
  let speeds = [0.5, 0.75, 1, 1.25, 1.5, 2];
  let speedIdx = 2;
  let sheetOpen = false;
  let toastTimeout;

  // ── VIDEO ──
  vid.volume = 0.8;
  vid.play().catch(() => {});

  function fmt(s) {
    const m = Math.floor(s / 60);
    const ss = Math.floor(s % 60).toString().padStart(2,'0');
    return `${m}:${ss}`;
  }

  function updatePlayIcon(paused) {
    playIcon.innerHTML = paused
      ? '<path d="M8 5v14l11-7z"/>'
      : '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
    tapSvg.innerHTML = paused
      ? '<path d="M8 5v14l11-7z"/>'
      : '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
  }

  vid.addEventListener('timeupdate', () => {
    if (!vid.duration) return;
    const pct = (vid.currentTime / vid.duration) * 100;
    progressFill.style.width = pct + '%';
    timeCur.textContent = fmt(vid.currentTime);
    timeTot.textContent = fmt(vid.duration);
  });

  vid.addEventListener('play',  () => updatePlayIcon(false));
  vid.addEventListener('pause', () => updatePlayIcon(true));

  // tap player → toggle play/pause
  let tapTimer;
  playerWrap.addEventListener('click', (e) => {
    addRipple(e, playerWrap);
    if (vid.paused) { vid.play(); } else { vid.pause(); }
    tapIcon.classList.add('show');
    clearTimeout(tapTimer);
    tapTimer = setTimeout(() => tapIcon.classList.remove('show'), 800);
  });

  // play button
  playBtn.addEventListener('click', (e) => {
    addRipple(e, playBtn);
    if (vid.paused) { vid.play(); } else { vid.pause(); }
  });

  // progress scrub
  let scrubbing = false;
  function scrubTo(e) {
    const rect = progressTrack.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const pct = Math.max(0, Math.min(1, x / rect.width));
    vid.currentTime = pct * vid.duration;
  }
  progressTrack.addEventListener('mousedown', (e) => { scrubbing = true; scrubTo(e); });
  progressTrack.addEventListener('touchstart', (e) => { scrubbing = true; scrubTo(e); }, {passive:true});
  document.addEventListener('mousemove', (e) => { if (scrubbing) scrubTo(e); });
  document.addEventListener('touchmove', (e) => { if (scrubbing) scrubTo(e); }, {passive:true});
  document.addEventListener('mouseup', () => scrubbing = false);
  document.addEventListener('touchend', () => scrubbing = false);

  // volume
  let volScrubbing = false;
  function setVol(e) {
    const rect = volTrack.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const pct = Math.max(0, Math.min(1, x / rect.width));
    vid.volume = pct;
    volFill.style.width = (pct * 100) + '%';
    vid.muted = pct === 0;
    updateVolIcon();
  }
  volTrack.addEventListener('mousedown', (e) => { volScrubbing = true; setVol(e); });
  volTrack.addEventListener('touchstart', (e) => { volScrubbing = true; setVol(e); }, {passive:true});
  document.addEventListener('mousemove', (e) => { if (volScrubbing) setVol(e); });
  document.addEventListener('touchmove', (e) => { if (volScrubbing) setVol(e); }, {passive:true});
  document.addEventListener('mouseup', () => volScrubbing = false);
  document.addEventListener('touchend', () => volScrubbing = false);

  volBtn.addEventListener('click', (e) => {
    addRipple(e, volBtn);
    vid.muted = !vid.muted;
    volFill.style.width = vid.muted ? '0%' : (vid.volume * 100) + '%';
    updateVolIcon();
  });

  function updateVolIcon() {
    volIcon.innerHTML = (vid.muted || vid.volume === 0)
      ? '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>'
      : '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
  }

  // fullscreen
  fsBtn.addEventListener('click', (e) => {
    addRipple(e, fsBtn);
    if (!document.fullscreenElement) {
      (playerWrap.requestFullscreen || playerWrap.webkitRequestFullscreen || (() => {})).call(playerWrap);
    } else {
      (document.exitFullscreen || document.webkitExitFullscreen || (() => {})).call(document);
    }
  });

  // speed
  speedChip.addEventListener('click', () => {
    speedIdx = (speedIdx + 1) % speeds.length;
    const s = speeds[speedIdx];
    vid.playbackRate = s;
    speedChip.textContent = s + '×';
  });

  // ── SHEET ──
  function openSheet() {
    sheetOpen = true;
    sheetOverlay.classList.add('open');
    sheet.classList.add('open');
    sheetTrigger.classList.add('hidden');
    document.body.style.overflow = 'hidden';
  }
  function closeSheet() {
    sheetOpen = false;
    sheetOverlay.classList.remove('open');
    sheet.classList.remove('open');
    sheetTrigger.classList.remove('hidden');
    document.body.style.overflow = '';
  }

  sheetTrigger.addEventListener('click', openSheet);
  sheetClose.addEventListener('click', closeSheet);
  sheetOverlay.addEventListener('click', (e) => {
    if (e.target === sheetOverlay) closeSheet();
  });
  dlShortBtn.addEventListener('click', openSheet);

  // drag to close
  let dragStart = null, dragCurrent = 0;
  function onDragStart(e) {
    dragStart = e.touches ? e.touches[0].clientY : e.clientY;
    sheet.style.transition = 'none';
  }
  function onDragMove(e) {
    if (dragStart === null) return;
    dragCurrent = (e.touches ? e.touches[0].clientY : e.clientY) - dragStart;
    if (dragCurrent < 0) dragCurrent = 0;
    sheet.style.transform = `translateY(${dragCurrent}px)`;
  }
  function onDragEnd() {
    if (dragStart === null) return;
    sheet.style.transition = '';
    sheet.style.transform = '';
    if (dragCurrent > 100) closeSheet();
    dragStart = null;
    dragCurrent = 0;
  }
  sheetHandle.addEventListener('mousedown', onDragStart);
  sheetHandle.addEventListener('touchstart', onDragStart, {passive:true});
  document.addEventListener('mousemove', onDragMove);
  document.addEventListener('touchmove', (e) => {
    if (dragStart !== null) { e.preventDefault(); onDragMove(e); }
  }, {passive:false});
  document.addEventListener('mouseup', onDragEnd);
  document.addEventListener('touchend', onDragEnd);

  // swipe up from bottom to open
  let swipeStartY = null;
  document.addEventListener('touchstart', (e) => {
    swipeStartY = e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener('touchend', (e) => {
    if (swipeStartY === null) return;
    const dy = swipeStartY - e.changedTouches[0].clientY;
    if (dy > 60 && e.changedTouches[0].clientY > window.innerHeight * 0.7 && !sheetOpen) {
      openSheet();
    }
    swipeStartY = null;
  }, {passive:true});

  // ── RESOLUTION ──
  const resSizes = { '360': '3.2', '720': '7.8', '1080': '12.95' };
  resPills.forEach(pill => {
    pill.addEventListener('click', () => {
      resPills.forEach(p => p.classList.remove('selected'));
      pill.classList.add('selected');
      selectedSize.textContent = resSizes[pill.dataset.res];
    });
  });

  // ── ACTIONS ──
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => toast.classList.remove('show'), 2200);
  }

  dlMainBtn.addEventListener('click', () => {
    const sel = document.querySelector('.res-pill.selected');
    const res = sel ? sel.dataset.res + 'p' : '720p';
    showToast(`⬇ Mengunduh ${res}...`);
  });

  shareBtn.addEventListener('click', () => {
    if (navigator.share) {
      navigator.share({ title: 'Obsidian Player', url: location.href });
    } else {
      showToast('🔗 Link disalin!');
    }
  });
  bookmarkBtn.addEventListener('click', () => showToast('🔖 Tersimpan ke daftar'));
  copyLinkBtn.addEventListener('click', () => {
    navigator.clipboard?.writeText(location.href).catch(() => {});
    showToast('🔗 Link disalin ke clipboard');
  });

  // duration display override for known file
  vid.addEventListener('loadedmetadata', () => {
    timeTot.textContent = '0:23';
  });
  function addRipple(e, el) {
    const rect = el.getBoundingClientRect();
    const r = document.createElement('span');
    r.className = 'ripple';
    const size = Math.max(rect.width, rect.height);
    r.style.cssText = `width:${size}px;height:${size}px;left:${(e.clientX||rect.left+rect.width/2)-rect.left-size/2}px;top:${(e.clientY||rect.top+rect.height/2)-rect.top-size/2}px`;
    el.appendChild(r);
    setTimeout(() => r.remove(), 600);
  }
</script>
</body>
</html>
