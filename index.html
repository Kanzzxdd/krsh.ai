<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>krsh.ai | Private Root v1.6</title>
    <style>
        body { 
            background-color: #000; 
            color: #0f0; 
            font-family: 'Courier New', monospace; 
            padding: 15px; 
            margin: 0; 
            height: 100vh; 
            box-sizing: border-box; 
            overflow-x: hidden; 
        }
        #terminal { 
            width: 100%; 
            height: 100%; 
            overflow-y: auto; 
            font-size: 14px; 
            line-height: 1.4;
        }
        .line { 
            display: block; 
            margin-bottom: 5px; 
            white-space: pre-wrap; 
            word-wrap: break-word; 
        }
        #input-area { display: flex; align-items: center; }
        input { 
            background: transparent; 
            border: none; 
            color: #0f0; 
            font-family: inherit; 
            font-size: inherit; 
            outline: none; 
            flex-grow: 1; 
        }
        .hidden { display: none; }
        /* Kursor Blok Hijau sesuai screenshot kamu */
        #caret, .fake-caret { 
            width: 8px; 
            height: 15px; 
            background: #0f0; 
            display: inline-block; 
            vertical-align: middle;
            margin-left: 5px;
            animation: blink 1s infinite; 
        }
        @keyframes blink { 50% { opacity: 0; } }
        .err { color: #ff0000; font-weight: bold; }
        .db-info { color: #00ff00; border-left: 2px solid #0f0; padding-left: 10px; margin: 10px 0; }
    </style>
</head>
<body>
    <div id="terminal">
        <span class="line">KRSH_AI PRIVATE KERNEL [Version 1.6.0_STABLE]</span>
        <span class="line">RESTRICTED ACCESS: ADMIN KANZA ONLY.</span>
        <span class="line">&nbsp;</span>
        <span class="line">Please authenticate to open secure tunnel:</span>
        <div id="input-area">
            <span style="margin-right: 10px;">kanza@krsh_ai:~#</span>
            <input type="password" id="authKey" autofocus onkeydown="check(event)">
            <span id="caret"></span>
        </div>
        <div id="logs"></div>
    </div>

    <script>
        const logs = document.getElementById('logs');
        const inputArea = document.getElementById('input-area');
        const authKey = document.getElementById('authKey');

        function check(e) { if (e.key === 'Enter') { validate(); } }

        async function validate() {
            const secret = "Kz!@#99_X-Rsh.Ai";
            const val = authKey.value;
            if (val === secret) {
                inputArea.classList.add('hidden');
                await print("> Synchronizing private keys...");
                await sleep(1000);
                await print("> [OK] Identity verified: Admin Kanza.");
                await sleep(600);
                await successSequence();
            } else {
                inputArea.classList.add('hidden');
                await print("> [ERROR] ACCESS DENIED.", "err");
                await sleep(2000);
                location.reload();
            }
        }

        async function print(text, className = "") {
            const l = document.createElement('span');
            l.className = 'line ' + className;
            l.textContent = text;
            logs.appendChild(l);
            logs.scrollTop = logs.scrollHeight;
        }

        function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

        async function successSequence() {
            const msg = [
                "------------------------------------------",
                "SYSTEM ONLINE - WELCOME HOME, BOSS.",
                "------------------------------------------",
                "> Server Loc      : GitHub Pages (kanzzxdd)",
                "> Webpage Status  : [SECURE / ON-SAFE]",
                "> Bot AI Engine   : [ACTIVE / PROTECTED]",
                "> Encryption      : AES-256 Enabled",
                "------------------------------------------",
                "Ready for your commands..."
            ];

            for (let t of msg) {
                const l = document.createElement('span');
                l.className = 'line';
                logs.appendChild(l);
                for (let c of t) {
                    l.textContent += c;
                    await sleep(20);
                }
            }
            
            // Panggil simulasi pemindahan database
            await sleep(1000);
            await showDatabaseReport("https://www.instagram.com/reel/DVbnqXMkqDP/");
        }

        async function showDatabaseReport(url) {
            const time = new Date().toLocaleTimeString('id-ID');
            await print("\n[!] MIGRATING LOCAL CACHE TO SERVER...");
            await sleep(1500);

            const report = document.createElement('div');
            report.className = 'db-info';
            report.innerHTML = `
                📊 <b>SERVER LOG: DATA MIGRATION</b><br>
                ──────────────────────────<br>
                🤖 AI ASSISTANT: Process Complete<br>
                🔗 Source: ${url}<br><br>
                Informasi status telah dipindahkan ke:<br>
                🗄️ DATABASE: private-kanza-server.db<br>
                📍 LOCATION: /root/srv/database/logs/<br><br>
                ✅ STATUS: Synchronized Success.<br>
                [${time}] Data secured on KRSH Server.<br>
                ──────────────────────────
            `;
            logs.appendChild(report);
            
            // Terakhir munculin kursor prompt satu aja di paling bawah
            const finalLine = document.createElement('div');
            finalLine.innerHTML = 'kanza@krsh_ai_private:~$ <span class="fake-caret"></span>';
            logs.appendChild(finalLine);
            logs.scrollTop = logs.scrollHeight;
        }
    </script>
</body>
</html>
