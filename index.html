<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>krsh.ai | Private Root v1.6</title>
    <style>
        body { 
            background-color: #000; 
            color: #0f0; 
            font-family: 'Courier New', monospace; 
            padding: 15px; 
            margin: 0; 
            height: 100vh; 
            box-sizing: border-box; 
            overflow: hidden; 
        }
        #terminal { 
            width: 100%; 
            height: 100%; 
            overflow-y: auto; 
            font-size: 13px; 
            line-height: 1.4;
        }
        .line { display: block; margin-bottom: 5px; white-space: pre-wrap; }

        /* Input System (Fix Cursor Double) */
        #input-area { display: flex; align-items: center; position: relative; }
        input { 
            position: absolute; left: 0; opacity: 0; width: 100%;
            border: none; outline: none; cursor: default;
        }
        #display-text { color: #0f0; letter-spacing: 2px; }

        /* Single Block Cursor */
        #caret, .fake-caret { 
            width: 8px; height: 16px; background: #0f0; 
            display: inline-block; vertical-align: middle;
            margin-left: 2px; animation: blink 1s infinite; 
        }

        /* Modern & Compact Maintenance Box */
        .maintenance-note {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background-color: rgba(18, 18, 18, 0.96);
            color: #fff;
            padding: 12px 18px;
            border-radius: 8px;
            border-left: 3px solid #0f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 11px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.8);
            z-index: 10000;
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 280px;
            animation: fadeIn 1s ease-out forwards;
        }
        .maintenance-note b { color: #0f0; display: block; margin-bottom: 2px; font-size: 12px; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes blink { 50% { opacity: 0; } }
        
        .err { color: #ff0000; font-weight: bold; }
        .db-report { 
            color: #0f0; margin: 15px 0; padding: 10px; 
            border: 1px dashed #0f0; background: rgba(0, 255, 0, 0.03);
        }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="maintenance-msg" class="maintenance-note">
        <div style="font-size: 18px;">🛠️</div>
        <div>
            <b>SISTEM MAINTENANCE</b>
            Sedang dalam perbaikan berkala oleh Admin Kanza.
        </div>
    </div>

    <div id="terminal">
        <span class="line">KRSH_AI PRIVATE KERNEL [Version 1.6.0_STABLE]</span>
        <span class="line">RESTRICTED ACCESS: ADMIN KANZA ONLY.</span>
        <span class="line">&nbsp;</span>
        <span class="line">Please authenticate to open secure tunnel:</span>
        
        <div id="input-area" onclick="document.getElementById('authKey').focus()">
            <span style="margin-right: 10px;">kanza@krsh_ai:~#</span>
            <span id="display-text"></span><span id="caret"></span>
            <input type="password" id="authKey" autofocus oninput="updateDisplay()" onkeydown="check(event)">
        </div>
        
        <div id="logs"></div>
    </div>

    <script>
        const logs = document.getElementById('logs');
        const inputArea = document.getElementById('input-area');
        const authKey = document.getElementById('authKey');
        const displayText = document.getElementById('display-text');

        function updateDisplay() {
            displayText.textContent = "*".repeat(authKey.value.length);
        }

        function check(e) { if (e.key === 'Enter') { validate(); } }

        async function validate() {
            const secret = "Kz!@#99_X-Rsh.Ai";
            // Command Tambahan: system --reload
            if (authKey.value.toLowerCase() === "system --reload") {
                await print("\n> Initiating system reboot...");
                await sleep(500);
                await print("> Cleaning local cache...");
                await sleep(1000);
                await print("> Reloading pages...");
                await sleep(500);
                location.reload();
                return;
            }

            if (authKey.value === secret) {
                inputArea.classList.add('hidden');
                await print("> [OK] Identity verified: Admin Kanza.");
                await sleep(800);
                await successSequence();
            } else {
                inputArea.classList.add('hidden');
                await print("> [ERROR] ACCESS DENIED.", "err");
                await sleep(2000);
                location.reload();
            }
        }

        async function print(text, className = "") {
            const l = document.createElement('span');
            l.className = 'line ' + className;
            l.textContent = text;
            logs.appendChild(l);
            logs.scrollTop = logs.scrollHeight;
        }

        function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

        async function successSequence() {
            const msg = [
                "------------------------------------------",
                "SYSTEM ONLINE - WELCOME BOSS.",
                "------------------------------------------",
                "> Security        : [ENCRYPTED]",
                "> Database Sync   : [READY]",
                "------------------------------------------"
            ];

            for (let t of msg) {
                const l = document.createElement('span');
                l.className = 'line';
                logs.appendChild(l);
                for (let c of t) {
                    l.textContent += c;
                    await sleep(25);
                }
            }
            
            await sleep(1000);
            const time = new Date().toLocaleTimeString('id-ID');
            const dbReport = document.createElement('div');
            dbReport.className = 'db-report';
            dbReport.innerHTML = `
                📊 <b>SERVER LOG: DATA MIGRATION</b><br>
                🤖 AI Assistant: Status info moved to server.<br>
                🗄️ Database: private-kanza-server.db<br>
                ✅ STATUS: Synchronized Success.<br>
                [${time}] - Securely recorded.
            `;
            logs.appendChild(dbReport);

            const final = document.createElement('div');
            final.innerHTML = 'kanza@krsh_ai_private:~$ <span class="fake-caret"></span>';
            logs.appendChild(final);
            logs.scrollTop = logs.scrollHeight;
        }
    </script>
</body>
</html>
